<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>測試集模型預測</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<style>
  :root { --bg:#f6f7f5; --ink:#1d2a1f; --accent:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141714; --ink:#e7ece6; --accent:#66bb6a; } }
  body { font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background:var(--bg); color:var(--ink); padding:16px; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<h1>🧠 測試集模型預測</h1>
<p>用 <code>../website/model/</code> 的自建模型預測 <code>test/images/</code> 全部照片，並下載 <code>predictions.csv</code>。
請把下載的檔案放到 <code>test/_sealed/</code>，標註完成前不要打開。</p>
<button id="run">開始預測</button> <span id="status"></span>
<script src="test/images.js"></script>
<script>
const GRADES = ["A", "B", "C", "D", "X"];
const ids = window.TEST_IDS || [];
const $ = (id) => document.getElementById(id);
const loadImage = (src) => new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => bad(new Error(src)); im.src = src; });

async function predictAll() {
  const model = await tmImage.load("../website/model/model.json", "../website/model/metadata.json");
  const rows = [];
  for (const [i, id] of ids.entries()) {
    const preds = await model.predict(await loadImage(`test/images/${id}.jpg`));
    const p = Object.fromEntries(preds.map(x => [x.className, x.probability]));
    const top = GRADES.reduce((a, b) => ((p[a] || 0) >= (p[b] || 0) ? a : b));
    rows.push({ test_id: id, pred: top, confidence: p[top], ...Object.fromEntries(GRADES.map(g => ["p_" + g, p[g] || 0])) });
    $("status").textContent = `預測中 ${i + 1} / ${ids.length}`;
  }
  return rows;
}

function toCsv(rows) {
  const cols = ["test_id", "pred", "confidence", ...GRADES.map(g => "p_" + g)];
  return [cols.join(",")].concat(rows.map(r => cols.map(c => typeof r[c] === "number" ? r[c].toFixed(4) : r[c]).join(","))).join("\r\n");
}

$("run").onclick = async () => {
  $("run").disabled = true;
  try {
    const rows = await predictAll();
    window.PREDICTIONS_CSV = toCsv(rows);
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([window.PREDICTIONS_CSV], { type: "text/csv" })), download: "predictions.csv" });
    a.click();
    $("status").textContent = `完成，共 ${rows.length} 張`;
  } catch (e) { $("status").textContent = "失敗：" + e.message; }
  $("run").disabled = false;
};
</script>
</body>
</html>
