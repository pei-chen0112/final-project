<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自建模型準確度評估</title>
<!-- 使用方式：在 final-project 資料夾執行  python -m http.server 5500
     然後開啟 http://localhost:5500/ml-training/evaluate.html -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<style>
  :root { --green:#2e7d32; --soft:#e8f5e9; --red:#d32f2f; --orange:#f59300; --border:#dfe7df; --muted:#5f6d61; }
  body { margin:0; font-family:"Microsoft JhengHei",system-ui,sans-serif; background:#f3f6f3; color:#1f2a20; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 60px; }
  h1 { color:var(--green); margin:0 0 4px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; margin-top:16px; }
  .muted { color:var(--muted); font-size:14px; }
  button, label.btn { display:inline-block; padding:10px 16px; border:0; border-radius:10px; background:var(--green); color:#fff; font-weight:700; cursor:pointer; font-size:15px; }
  button.ghost { background:#eef2ee; color:#1f2a20; }
  input[type=file] { display:none; }
  input[type=text] { padding:8px 10px; border:1px solid var(--border); border-radius:8px; width:220px; }
  table { border-collapse:collapse; margin-top:10px; }
  th, td { border:1px solid var(--border); padding:8px 12px; text-align:center; }
  th { background:var(--green); color:#fff; }
  td.diag { background:var(--soft); font-weight:800; color:var(--green); }
  td.bad { background:#fdecea; color:var(--red); font-weight:700; }
  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:12px; }
  .metric { background:#f6f9f6; border-radius:12px; padding:14px; }
  .metric strong { display:block; font-size:26px; }
  .pass { color:var(--green); } .fail { color:var(--red); }
  .wrong { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:10px; }
  .wrong figure { margin:0; background:#f6f9f6; border-radius:10px; overflow:hidden; font-size:12px; }
  .wrong img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .wrong figcaption { padding:6px 8px; }
  progress { width:100%; height:12px; }
</style>
</head>
<body>
<main>
  <h1>🧠 自建模型準確度評估</h1>
  <p class="muted">教學第 9 章：用沒有拿去訓練的測試照片檢驗模型。選擇 <b>test</b> 資料夾（裡面依等級分成 A、B、C、D、X 子資料夾），就會自動算出混淆矩陣與驗收指標。</p>

  <div class="card">
    <p>模型位置：<input type="text" id="modelUrl" value="../website/model/"> <span class="muted" id="modelStatus">尚未載入</span></p>
    <label class="btn" for="folder">📁 選擇 test 資料夾</label>
    <input type="file" id="folder" webkitdirectory multiple>
    <button class="ghost" id="trainCheck" title="用 labels.csv 與 labeled/ 的照片檢查（這些照片已拿去訓練，分數會偏高）">訓練資料檢查</button>
    <p class="muted" id="status"></p>
    <progress id="bar" value="0" max="1" hidden></progress>
  </div>

  <div id="result"></div>
</main>

<script>
const GRADES = ["A", "B", "C", "D", "X"];
let model = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function loadModel() {
  if (model) return model;
  const url = $("modelUrl").value.replace(/\/?$/, "/");
  $("modelStatus").textContent = "載入中…";
  model = await tmImage.load(url + "model.json", url + "metadata.json");
  const labels = model.getClassLabels();
  $("modelStatus").textContent = `已載入，類別：${labels.join("、")}`;
  if (!["A", "B", "C", "D"].every(g => labels.includes(g))) throw new Error("模型類別必須是 A、B、C、D、X");
  return model;
}

function loadImage(src) {
  return new Promise((resolve, reject) => { const im = new Image(); im.onload = () => resolve(im); im.onerror = () => reject(new Error("無法讀取圖片")); im.src = src; });
}

async function evaluate(items, title) {
  // items: [{ grade, name, src }]
  await loadModel();
  const cm = Object.fromEntries(GRADES.map(g => [g, Object.fromEntries(GRADES.map(h => [h, 0]))]));
  const wrong = [];
  let conf = 0;
  $("bar").hidden = false; $("bar").max = items.length; $("bar").value = 0;
  for (const [i, it] of items.entries()) {
    try {
      const preds = await model.predict(await loadImage(it.src));
      const top = preds.reduce((a, b) => (a.probability >= b.probability ? a : b));
      cm[it.grade][top.className]++;
      conf += top.probability;
      if (top.className !== it.grade) wrong.push({ ...it, pred: top.className, p: top.probability });
    } catch (e) { console.warn(it.name, e); }
    $("bar").value = i + 1;
    $("status").textContent = `評估中 ${i + 1}/${items.length}`;
    if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
  }
  $("bar").hidden = true;
  render(cm, wrong, conf / items.length, title);
}

function render(cm, wrong, meanConf, title) {
  const rowTotal = (g) => GRADES.reduce((s, h) => s + cm[g][h], 0);
  const total = GRADES.reduce((s, g) => s + rowTotal(g), 0);
  const correct = GRADES.reduce((s, g) => s + cm[g][g], 0);
  const acc = total ? correct / total : 0;
  const dTot = rowTotal("D");
  const dAsGood = dTot ? (cm.D.A + cm.D.B) / dTot : 0;
  const pct = (x) => (x * 100).toFixed(1) + "%";
  const ok = (cond) => `<span class="${cond ? "pass" : "fail"}">${cond ? "✔ 通過" : "✘ 未通過"}</span>`;
  const rows = GRADES.filter(g => rowTotal(g) > 0).map(g => `<tr><th>${g}</th>${GRADES.map(h =>
    `<td class="${g === h ? "diag" : cm[g][h] ? "bad" : ""}">${cm[g][h]}</td>`).join("")}<td>${rowTotal(g)}</td><td>${pct(cm[g][g] / rowTotal(g))}</td></tr>`).join("");
  $("result").innerHTML = `
    <div class="card">
      <h2>${esc(title)}</h2>
      <div class="metrics">
        <div class="metric"><span class="muted">整體準確率（標準 ≥ 80%）</span><strong>${pct(acc)}</strong>${ok(acc >= 0.8)}</div>
        <div class="metric"><span class="muted">D 被判成 A/B（標準 ≤ 5%）</span><strong>${pct(dAsGood)}</strong>${ok(dAsGood <= 0.05)}</div>
        <div class="metric"><span class="muted">平均信心</span><strong>${pct(meanConf)}</strong></div>
        <div class="metric"><span class="muted">照片數</span><strong>${total}</strong></div>
      </div>
      <h3>混淆矩陣（列 = 正確答案，欄 = 模型答案）</h3>
      <table><tr><th>正確＼模型</th>${GRADES.map(g => `<th>${g}</th>`).join("")}<th>張數</th><th>準確率</th></tr>${rows}</table>
    </div>
    <div class="card">
      <h3>判斷錯誤的照片（${wrong.length} 張）</h3>
      <p class="muted">先檢查是不是標註錯了；標註正確但模型判錯的，代表這類照片需要補更多。</p>
      <div class="wrong">${wrong.slice(0, 200).map(w => `<figure><img src="${esc(w.src)}" loading="lazy" alt=""><figcaption>正確 <b>${w.grade}</b> → 模型 <b>${w.pred}</b>（${pct(w.p)}）<br><span class="muted">${esc(w.name)}</span></figcaption></figure>`).join("")}</div>
    </div>`;
  $("status").textContent = "完成";
}

// 選擇 test 資料夾：依子資料夾名稱（A~X）當作正確答案
$("folder").addEventListener("change", (e) => {
  const items = [...e.target.files].filter(f => /\.(jpe?g|png|webp)$/i.test(f.name)).map(f => {
    const parts = f.webkitRelativePath.split("/");
    return { grade: parts[parts.length - 2], name: f.name, src: URL.createObjectURL(f) };
  }).filter(it => GRADES.includes(it.grade));
  if (!items.length) { $("status").textContent = "找不到照片：請選擇裡面有 A、B、C、D、X 子資料夾的 test 資料夾"; return; }
  evaluate(items, `測試資料評估（${items.length} 張）`).catch(err => { $("status").textContent = "錯誤：" + err.message; });
});

// 訓練資料檢查：讀 labels.csv，評估 labeled/ 裡的照片
$("trainCheck").addEventListener("click", async () => {
  try {
    const text = (await (await fetch("labels.csv", { cache: "no-cache" })).text()).replace(/^﻿/, "");
    const lines = text.split(/\r?\n/).filter(Boolean);
    const head = lines.shift().split(",");
    const fi = head.indexOf("file"), gi = head.indexOf("grade");
    const items = lines.map(l => l.split(",")).filter(c => GRADES.includes(c[gi]))
      .map(c => ({ grade: c[gi], name: c[fi], src: `labeled/${c[gi]}/${encodeURIComponent(c[fi])}` }));
    await evaluate(items, `訓練資料檢查（${items.length} 張，已拿去訓練，分數會偏高）`);
  } catch (err) { $("status").textContent = "錯誤：" + err.message; }
});
</script>
</body>
</html>
